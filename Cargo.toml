[package]
name = "epochup"
version = "0.1.0"
edition = "2024"
description = "Popup converter between dates and unix epoch"
license = "MIT"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
jiff = "0.2"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
libc = "0.2"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

[[bench]]
name = "parse"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
